name = "tiers-api"
main = "index.js"
compatibility_date = "2026-07-01"

# ── D1 Database ─────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "tiers-db"
database_id = "ВСТАВЬ_ID_СЮДА"  # После: wrangler d1 create tiers-db

# ── Секреты (добавить через: wrangler secret put JWT_SECRET) ─
# JWT_SECRET — случайная строка 64+ символа, НИКОГДА не храни в файле
