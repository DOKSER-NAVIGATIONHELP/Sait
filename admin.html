<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Админ панель</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap');

:root{
  --bg:#050303;
  --panel:#0D0808;
  --line:#2E1210;
  --text:#DDD6D4;
  --text-dim:#6A5E5D;
  --red:#8B2820;
  --red-dim:#3A100D;
  --red-bright:#A83328;
  --font-display:'Unbounded', sans-serif;
  --font-body:'Manrope', sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  background:var(--bg);
  font-family:var(--font-body);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body.modal-open{overflow:hidden;}

/* PAGE LAYOUT */
.admin-page{
  max-width:600px;
  margin:0 auto;
  padding:32px 20px 60px;
}

.admin-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.admin-logo{
  font-family:var(--font-display);
  font-weight:700;
  font-size:14px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--red-bright);
  display:flex;
  align-items:center;
  gap:8px;
}
.admin-logo::before{
  content:'';
  width:7px; height:7px;
  border-radius:50%;
  background:var(--red-bright);
  box-shadow:0 0 10px var(--red-bright);
}
.admin-back{
  font-size:12px;
  color:var(--text-dim);
  text-decoration:none;
  border:1px solid var(--line);
  border-radius:7px;
  padding:6px 12px;
  transition:border-color .2s, color .2s;
}
.admin-back:hover{border-color:var(--red); color:var(--red-bright);}

/* LOGIN SCREEN */
#login-screen{
  max-width:360px;
  margin:60px auto 0;
}
.login-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:20px;
  margin-bottom:24px;
  text-align:center;
}
.login-form{display:flex; flex-direction:column; gap:14px;}

/* ADMIN PANEL */
#admin-screen{display:none;}

/* ADMIN ORDERS TAB */
.admin-tab .badge-count{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:16px; height:16px; padding:0 4px; margin-left:5px;
  border-radius:8px; background:var(--red); color:#0A0909;
  font-size:10px; font-weight:800;
}
.order-item{
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  background:var(--panel);
}
.order-item.pending{border-color:rgba(193,68,60,.35);}
.order-item.approved{border-color:rgba(76,201,138,.3);}
.order-item.rejected{opacity:.6;}
.order-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.order-tier{font-family:var(--font-display); font-weight:700; font-size:14px;}
.order-date{font-size:11px; color:var(--text-dim); margin-top:2px;}
.order-status{
  flex-shrink:0;
  font-size:10.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:4px 9px;
  border-radius:6px;
}
.order-status.pending{background:rgba(193,68,60,.15); color:var(--red-bright);}
.order-status.approved{background:rgba(76,201,138,.15); color:#4CC98A;}
.order-status.rejected{background:rgba(255,255,255,.06); color:var(--text-dim);}
.order-meta{
  display:flex; flex-wrap:wrap; gap:6px 14px;
  font-size:12px; color:var(--text-dim); margin-bottom:10px;
}
.order-meta b{color:var(--text); font-weight:600;}
.order-receipt-link{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px;
  background:#050303;
  border:1px solid var(--line);
  border-radius:8px;
  margin-bottom:10px;
  cursor:pointer;
  text-decoration:none;
  color:var(--text);
}
.order-receipt-link img{width:36px; height:36px; object-fit:cover; border-radius:5px;}
.order-receipt-link .file-ico{width:36px; height:36px; border-radius:5px; background:var(--red-dim); color:var(--red-bright); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.order-receipt-link span{font-size:12px; font-weight:600;}
.order-actions{display:flex; gap:8px;}
.order-actions button{
  flex:1;
  padding:9px;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
}
.order-actions .approve-btn:hover{border-color:#4CC98A; color:#4CC98A;}
.order-actions .reject-btn:hover{border-color:#A83328; color:#A83328;}
.order-empty{
  text-align:center;
  padding:40px 20px;
  color:var(--text-dim);
  font-size:13px;
}

/* Lightbox */
.lightbox-overlay{
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,.85);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.lightbox-overlay.open{display:flex;}
.lightbox-overlay img{max-width:100%; max-height:85vh; border-radius:10px;}
.lightbox-close{
  position:absolute; top:18px; right:18px;
  width:38px; height:38px; border-radius:50%;
  background:rgba(255,255,255,.1); border:none; color:#fff;
  font-size:18px; cursor:pointer;
}

/* LOGS TAB */
.logs-toolbar{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.logs-select{
  flex:1;
  min-width:140px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  padding:7px 10px;
  border-radius:8px;
  font-family:var(--font-body);
  font-size:13px;
  cursor:pointer;
}
.logs-select:focus{outline:none;border-color:var(--red);}
.btn-sm.danger{background:rgba(139,40,32,.25);border-color:var(--red-dim);}
.btn-sm.danger:hover{background:rgba(139,40,32,.5);border-color:var(--red);}
.log-item{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:8px;
  font-size:12px;
}
.log-item.event-order_submit{border-left:3px solid #a83328;}
.log-item.event-admin_login_ok{border-left:3px solid #2a7a2a;}
.log-item.event-admin_login_fail{border-left:3px solid #8b2820;}
.log-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px;flex-wrap:wrap;}
.log-event{
  font-weight:700;
  font-size:11px;
  padding:2px 7px;
  border-radius:20px;
  background:var(--red-dim);
  color:var(--text);
  white-space:nowrap;
}
.log-event.ev-order_submit{background:rgba(139,40,32,.4);}
.log-event.ev-admin_login_ok{background:rgba(42,122,42,.35);color:#6dca6d;}
.log-event.ev-admin_login_fail{background:rgba(139,40,32,.5);color:#e07070;}
.log-event.ev-request{background:rgba(40,40,80,.5);color:#a0a0d0;}
.log-date{color:var(--text-dim);font-size:11px;white-space:nowrap;}
.log-ip{font-weight:700;color:var(--red-bright);margin-bottom:3px;}
.log-ua{color:var(--text-dim);word-break:break-all;line-height:1.4;}
.log-path{color:#8888aa;word-break:break-all;margin-top:2px;}
.log-extra{margin-top:4px;padding:4px 8px;background:rgba(0,0,0,.3);border-radius:6px;color:#aaa;word-break:break-all;}
.logs-stats{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.log-stat-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 12px;
  font-size:12px;
  flex:1;
  min-width:80px;
  text-align:center;
}
.log-stat-num{font-size:18px;font-weight:700;color:var(--red-bright);display:block;}
.log-stat-lbl{color:var(--text-dim);font-size:11px;}
.logs-page-btn{
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  padding:6px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}
.logs-page-btn:disabled{opacity:.4;cursor:default;}
.logs-page-info{color:var(--text-dim);font-size:12px;}

/* ADMIN PANEL TABS */
.admin-tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  flex-wrap:nowrap;
  margin-left:-20px;
  margin-right:-20px;
  padding-left:20px;
  padding-right:20px;
}
.admin-tabs::-webkit-scrollbar{display:none;}
.admin-tab{
  background:none;
  border:1px solid var(--line);
  border-radius:6px;
  color:var(--text-dim);
  font-family:var(--font-display);
  font-size:11px;
  font-weight:700;
  padding:7px 14px;
  cursor:pointer;
  letter-spacing:.04em;
  text-transform:uppercase;
  transition:border-color .2s, color .2s, background .2s;
  flex-shrink:0;
  white-space:nowrap;
}
.admin-tab.active, .admin-tab:hover{
  border-color:var(--red);
  color:var(--red-bright);
  background:var(--red-dim);
}

/* TIER LIST IN ADMIN */
.admin-tier-list{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
.admin-tier-item{
  background:#050303;
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:border-color .2s;
}
.admin-tier-item:hover{border-color:var(--red-dim);}
.admin-tier-item.selected{border-color:var(--red);}
.admin-tier-item-info{flex:1;}
.admin-tier-item-name{font-weight:700; font-size:14px; margin-bottom:2px;}
.admin-tier-item-price{font-size:12px; color:var(--text-dim);}
.admin-tier-item-actions{display:flex; gap:8px;}
.icon-btn{
  background:none;
  border:1px solid var(--line);
  border-radius:6px;
  color:var(--text-dim);
  width:32px; height:32px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:border-color .2s, color .2s;
  font-size:13px;
}
.icon-btn:hover{border-color:var(--red); color:var(--red-bright);}
.icon-btn.danger:hover{border-color:#c13c3c; color:#e15050;}
.icon-btn.move:hover{border-color:#888; color:#ccc;}

/* TIER EDITOR */
.tier-editor{display:flex; flex-direction:column; gap:14px;}
.price-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.features-list{display:flex; flex-direction:column; gap:8px; margin-bottom:4px;}
.feature-row{display:flex; gap:8px; align-items:center;}
.feature-row input{flex:1;}
.add-feature-btn{
  background:none;
  border:1px dashed var(--line);
  border-radius:8px;
  color:var(--text-dim);
  font-size:13px;
  padding:9px;
  cursor:pointer;
  text-align:center;
  transition:border-color .2s, color .2s;
  font-family:var(--font-body);
}
.add-feature-btn:hover{border-color:var(--red); color:var(--red-bright);}
.checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px;}
.checkbox-row input[type=checkbox]{
  width:16px; height:16px;
  accent-color:var(--red);
  cursor:pointer;
}

/* FORM FIELDS */
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}
.field input, .field textarea, .field select{
  background:#050303;
  border:1px solid var(--line);
  border-radius:8px;
  padding:11px 14px;
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  outline:none;
  transition:border-color .2s;
  width:100%;
}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--red);}
.field textarea{resize:vertical; min-height:70px;}
.err{font-size:12px; color:var(--red-bright); margin-top:4px;}

/* BUTTONS */
.btn-sm{
  padding:10px 16px;
  font-size:12px;
  font-family:var(--font-display);
  font-weight:700;
  border-radius:7px;
  border:none;
  cursor:pointer;
  letter-spacing:.03em;
  transition:filter .2s, transform .2s;
}
.btn-sm.red{background:var(--red); color:#0A0909;}
.btn-sm.red:hover{filter:brightness(1.1); transform:translateY(-1px);}
.btn-sm.ghost{background:transparent; border:1px solid var(--line); color:var(--text-dim);}
.btn-sm.ghost:hover{border-color:var(--red); color:var(--red-bright);}
.row-btns{display:flex; gap:10px; margin-top:4px; justify-content:flex-end;}
.divider{height:1px; background:var(--line); margin:4px 0;}
.section-label{font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px;}
.badge-hl{
  display:inline-block;
  background:var(--red-dim);
  color:var(--red-bright);
  font-size:10px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  border-radius:4px;
  padding:2px 7px;
  margin-left:8px;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:24px; right:20px;
  background:var(--red);
  color:#0A0909;
  font-family:var(--font-display);
  font-size:12px;
  font-weight:700;
  padding:10px 16px;
  border-radius:8px;
  z-index:400;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .3s, transform .3s;
  pointer-events:none;
}
.toast.show{opacity:1; transform:translateY(0);}

@media(max-width:480px){
  .admin-page{padding:20px 16px 48px;}
}
</style>
</head>
<body>

<div class="admin-page">
  <div class="admin-header">
    <div class="admin-logo">Админ панель</div>
    <a href="index.html" class="admin-back">← На сайт</a>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-title">Вход в админку</div>
    <div class="login-form">
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="login-password" placeholder="Введите пароль" autocomplete="current-password">
        <div class="err" id="login-err" style="display:none">Неверный пароль</div>
      </div>
      <button class="btn-sm red" id="login-submit" style="width:100%">Войти</button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin-screen">
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="tiers">Тарифы</button>
      <button class="admin-tab" data-tab="new">+ Новый тариф</button>
      <button class="admin-tab" data-tab="orders">Заявки<span class="badge-count" id="orders-badge" style="display:none">0</span></button>
      <button class="admin-tab" data-tab="requisites">Реквизиты</button>
      <button class="admin-tab" data-tab="settings">Настройки</button>
      <button class="admin-tab" data-tab="logs">📋 Логи<span class="badge-count" id="logs-badge" style="display:none">0</span></button>
    </div>

    <!-- TAB: TIERS LIST -->
    <div id="tab-tiers">
      <div class="admin-tier-list" id="admin-tier-list"></div>
      <div id="tier-editor-wrap" style="display:none">
        <div class="divider" style="margin-bottom:16px"></div>
        <div class="section-label" style="margin-bottom:12px">Редактировать тариф</div>
        <div id="tier-editor-form" class="tier-editor"></div>
        <div class="row-btns" style="margin-top:14px">
          <button class="btn-sm ghost" id="editor-cancel">Отмена</button>
          <button class="btn-sm red" id="editor-save">Сохранить</button>
        </div>
      </div>
    </div>

    <!-- TAB: NEW TIER -->
    <div id="tab-new" style="display:none">
      <div id="new-tier-form" class="tier-editor"></div>
      <div class="row-btns" style="margin-top:14px">
        <button class="btn-sm red" id="new-tier-save">Создать тариф</button>
      </div>
    </div>

    <!-- TAB: ORDERS -->
    <div id="tab-orders" style="display:none">
      <div id="orders-list"></div>
    </div>

    <!-- TAB: REQUISITES -->
    <div id="tab-requisites" style="display:none">
      <div class="tier-editor">
        <div class="section-label">🇷🇺 Рубли — Ozon Банк</div>
        <div class="field"><label>Название банка</label><input type="text" id="req-rubBank" placeholder="Ozon Банк"></div>
        <div class="field"><label>Номер карты</label><input type="text" id="req-rubCard" placeholder="2204321166536060"></div>
        <div class="field"><label>С каких карт можно переводить (через запятую)</label><textarea id="req-rubCardsAccepted" placeholder="Сбербанк, Тинькофф, ВТБ..."></textarea></div>

        <div class="divider"></div>
        <div class="section-label">🇺🇦 Гривны — Monobank</div>
        <div class="field"><label>Название банка</label><input type="text" id="req-uahBank" placeholder="Monobank"></div>
        <div class="field"><label>Номер карты</label><input type="text" id="req-uahCard" placeholder="4441114432886206"></div>
        <div class="field"><label>С каких карт можно переводить (через запятую)</label><textarea id="req-uahCardsAccepted" placeholder="Monobank, ПриватБанк..."></textarea></div>

        <div class="divider"></div>
        <div class="section-label">💎 Криптовалюта</div>
        <div class="field"><label>TON адрес кошелька</label><input type="text" id="req-tonAddress" placeholder="UQ..."></div>
        <div class="field"><label>USDT TRC-20 адрес</label><input type="text" id="req-trcAddress" placeholder="T..."></div>

        <div class="divider"></div>
        <div class="section-label">⭐ Telegram Stars</div>
        <div class="field"><label>Текст-подсказка для оплаты звёздами</label><textarea id="req-starsNote" placeholder="Напишите нам в Telegram..."></textarea></div>

        <div class="row-btns" style="margin-top:14px">
          <button class="btn-sm red" id="req-save">Сохранить реквизиты</button>
        </div>
      </div>
    </div>

    <!-- TAB: LOGS -->
    <div id="tab-logs" style="display:none">
      <div class="logs-toolbar">
        <select id="logs-filter-type" class="logs-select">
          <option value="all">Все события</option>
          <option value="request">Посещения</option>
          <option value="order_submit">Заявки</option>
          <option value="admin_login_ok">Входы в админку</option>
          <option value="admin_login_fail">Неверный пароль</option>
        </select>
        <button class="btn-sm" id="logs-refresh-btn">↻ Обновить</button>
        <button class="btn-sm danger" id="logs-clear-btn">🗑 Очистить</button>
      </div>
      <div id="logs-stats-bar"></div>
      <div id="logs-list"><div class="order-empty">Загрузка логов…</div></div>
      <div id="logs-pagination" style="display:flex;gap:10px;align-items:center;margin-top:12px;justify-content:center;"></div>
    </div>

    <!-- TAB: SETTINGS -->
    <div id="tab-settings" style="display:none">
      <div class="tier-editor">
        <div class="field">
          <label>Изменить пароль администратора</label>
          <input type="password" id="current-password" placeholder="Текущий пароль" autocomplete="current-password">
        </div>
        <div class="field">
          <input type="password" id="new-password" placeholder="Новый пароль" autocomplete="new-password">
        </div>
        <div class="field">
          <input type="password" id="new-password-confirm" placeholder="Повторите пароль">
          <div class="err" id="pw-err" style="display:none"></div>
        </div>
        <div class="row-btns">
          <button class="btn-sm red" id="save-password">Сменить пароль</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox-overlay" id="lightbox-overlay">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="Чек">
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// API CONFIG
// ============================================================
var API_BASE = 'https://sait-76t5.onrender.com';
var adminToken = null;

function apiFetch(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if(adminToken) opts.headers['Authorization'] = 'Bearer ' + adminToken;
  return fetch(API_BASE + path, opts).then(function(res){
    return res.json().then(function(data){
      if(!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    });
  });
}

// ============================================================
// DATA LAYER
// ============================================================
var STORAGE_KEY = 'tiers_data_v1';
var REQ_STORAGE_KEY = 'tiers_requisites_v1';

var DEFAULT_TIERS = [

function tierFromApi(t){
  return { id:t.id, name:t.name, flag:t.flag||'', highlight:!!t.highlight, priceRub:t.price_rub||0, priceUsdt:t.price_usdt||0, priceUah:t.price_uah||0, priceStars:t.price_stars||0, period:t.period||'/ месяц', desc:t.description||'', features:t.features||[], ctaText:t.cta_text||'Оформить', ctaLink:'#' };
}
function fetchTiersFromApi(){
  return apiFetch('/api/tiers').then(function(data){ return (data.tiers||[]).map(tierFromApi); });
}
function loadTiers(){
  try{ var raw=localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_TIERS));
}
function saveTiers(t){ localStorage.setItem(STORAGE_KEY, JSON.stringify(t)); }
function uid(){ return 't'+ Date.now() + Math.floor(Math.random()*1000); }

function loadRequisites(){
  try{ var raw=localStorage.getItem(REQ_STORAGE_KEY); if(raw) return Object.assign({}, DEFAULT_REQUISITES, JSON.parse(raw)); }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_REQUISITES));
}
function saveRequisites(r){ localStorage.setItem(REQ_STORAGE_KEY, JSON.stringify(r)); }
function fetchRequisitesFromApi(){
  return apiFetch('/api/requisites').then(function(data){ return Object.assign({}, DEFAULT_REQUISITES, data.requisites||{}); });
}
function saveRequisitesToApi(r){
  return apiFetch('/api/admin/requisites', { method:'PUT', body:JSON.stringify(r) });
}

var requisites = loadRequisites();
var tiers = loadTiers();
var editingId = null;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(n){ return Number(n).toLocaleString('ru-RU'); }

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

document.getElementById('login-submit').onclick = doLogin;
document.getElementById('login-password').onkeydown = function(e){ if(e.key==='Enter') doLogin(); };
setTimeout(function(){ document.getElementById('login-password').focus(); }, 100);

function doLogin(){
  var val = document.getElementById('login-password').value;
  var submitBtn = document.getElementById('login-submit');
  var errBox = document.getElementById('login-err');
  errBox.style.display = 'none';
  submitBtn.disabled = true;
  apiFetch('/api/admin/login', { method:'POST', body:JSON.stringify({ password:val }) })
    .then(function(data){
      adminToken = data.token;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = '';
      initAdmin();
    })
    .catch(function(){
      errBox.textContent = 'Неверный пароль';
      errBox.style.display = 'block';
    })
    .finally(function(){ submitBtn.disabled = false; });
}

function initAdmin(){
  switchTab('tiers');
  fetchTiersFromApi().then(function(apiTiers){
    tiers = apiTiers;
    renderAdminList();
  }).catch(function(e){ showToast('Не удалось загрузить тарифы: ' + e.message); });
  fetchRequisitesFromApi().then(function(r){
    requisites = r;
    fillRequisitesForm();
  }).catch(function(){});
  refreshOrdersFromApi();
}

// TABS
document.querySelectorAll('.admin-tab').forEach(function(btn){
  btn.onclick = function(){ switchTab(btn.getAttribute('data-tab')); };
});
function switchTab(tab){
  document.querySelectorAll('.admin-tab').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab')===tab);
  });
  document.getElementById('tab-tiers').style.display     = tab==='tiers'       ? '' : 'none';
  document.getElementById('tab-new').style.display       = tab==='new'         ? '' : 'none';
  document.getElementById('tab-orders').style.display    = tab==='orders'      ? '' : 'none';
  document.getElementById('tab-requisites').style.display= tab==='requisites'  ? '' : 'none';
  document.getElementById('tab-settings').style.display  = tab==='settings'    ? '' : 'none';
  document.getElementById('tab-logs').style.display      = tab==='logs'        ? '' : 'none';
  if(tab==='new') buildTierForm(document.getElementById('new-tier-form'), null);
  if(tab==='tiers'){ editingId=null; document.getElementById('tier-editor-wrap').style.display='none'; }
  if(tab==='orders') renderOrdersList();
  if(tab==='requisites') fillRequisitesForm();
  if(tab==='logs') refreshLogsFromApi();
}

// ============================================================
// ADMIN TIER LIST
// ============================================================
function renderAdminList(){
  var list = document.getElementById('admin-tier-list');
  list.innerHTML = '';
  tiers.forEach(function(t, idx){
    var item = document.createElement('div');
    item.className = 'admin-tier-item' + (editingId===t.id ? ' selected' : '');
    item.innerHTML =
      '<div class="admin-tier-item-info">'+
        '<div class="admin-tier-item-name">'+ esc(t.name) + (t.highlight ? ' <span class="badge-hl">топ</span>' : '') +'</div>'+
        '<div class="admin-tier-item-price">₽'+ num(t.priceRub) +' · $'+ (t.priceUsdt||0) +' · ₴'+ (t.priceUah||0) +' · ⭐'+(t.priceStars||0)+'</div>'+
      '</div>'+
      '<div class="admin-tier-item-actions">'+
        '<button class="icon-btn move" data-move="-1" data-idx="'+idx+'" title="Вверх">↑</button>'+
        '<button class="icon-btn move" data-move="1"  data-idx="'+idx+'" title="Вниз">↓</button>'+
        '<button class="icon-btn" data-edit="'+t.id+'" title="Редактировать">✎</button>'+
        '<button class="icon-btn danger" data-del="'+t.id+'" title="Удалить">✕</button>'+
      '</div>';
    list.appendChild(item);
  });
  list.querySelectorAll('[data-del]').forEach(function(btn){
    btn.onclick = function(e){ e.stopPropagation(); deleteTier(btn.getAttribute('data-del')); };
  });
  list.querySelectorAll('[data-edit]').forEach(function(btn){
    btn.onclick = function(e){ e.stopPropagation(); startEdit(btn.getAttribute('data-edit')); };
  });
  list.querySelectorAll('[data-move]').forEach(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      moveTier(parseInt(btn.getAttribute('data-idx')), parseInt(btn.getAttribute('data-move')));
    };
  });
}

function deleteTier(id){
  if(!confirm('Удалить тариф?')) return;
  apiFetch('/api/admin/tiers/' + id, { method:'DELETE' }).then(function(){
    tiers = tiers.filter(function(t){ return t.id!==id; });
    renderAdminList();
    if(editingId===id){ editingId=null; document.getElementById('tier-editor-wrap').style.display='none'; }
    showToast('Тариф удалён');
  }).catch(function(e){ showToast('Ошибка: ' + e.message); });
}

function moveTier(idx, dir){
  var newIdx = idx + dir;
  if(newIdx<0 || newIdx>=tiers.length) return;
  var id = tiers[idx].id;
  var direction = dir<0 ? 'up' : 'down';
  apiFetch('/api/admin/tiers/' + id + '/move', { method:'PUT', body:JSON.stringify({ direction:direction }) })
    .then(function(){ return fetchTiersFromApi(); })
    .then(function(apiTiers){ tiers=apiTiers; renderAdminList(); })
    .catch(function(e){ showToast('Ошибка: ' + e.message); });
}

// TIER FORM BUILDER

function buildTierForm(container, tier){
  var t = tier || { id:'', name:'', flag:'', highlight:false, priceRub:0, priceUsdt:0, priceUah:0, priceStars:0, period:'/ месяц', desc:'', features:[''], ctaText:'Оформить', ctaLink:'#' };
  container.innerHTML = '';
  function field(label, id, val, placeholder, type){
    return '<div class="field"><label>'+label+'</label><input type="'+(type||'text')+'" id="'+id+'" value="'+esc(val||'')+'" placeholder="'+(placeholder||'')+'"></div>';
  }
  container.innerHTML +=
    field('Название','f-name',t.name,'Базовый') +
    field('Пометка (под названием)','f-flag',t.flag,'старт / чаще выбирают / максимум') +
    '<div class="divider"></div><div class="section-label">Цены</div>'+
    '<div class="price-grid">'+
      field('Рубли (₽)','f-rub',t.priceRub,'990','number') +
      field('USDT ($)','f-usdt',t.priceUsdt,'11','number') +
      field('Гривны (₴)','f-uah',t.priceUah,'450','number') +
      field('Telegram ⭐','f-stars',t.priceStars,'250','number') +
    '</div>'+
    field('Период','f-period',t.period,'/ месяц')+
    '<div class="divider"></div><div class="section-label">Описание</div>'+
    '<div class="field"><textarea id="f-desc" placeholder="Пара строк о тарифе...">'+ esc(t.desc) +'</textarea></div>'+
    '<div class="divider"></div><div class="section-label">Возможности</div>'+
    '<div class="features-list" id="f-features-list"></div>'+
    '<button class="add-feature-btn" id="f-add-feature">+ Добавить пункт</button>'+
    '<div class="divider"></div><div class="section-label">Кнопка</div>'+
    field('Текст кнопки','f-cta-text',t.ctaText,'Оформить') +
    field('Ссылка кнопки','f-cta-link',t.ctaLink,'https://...') +
    '<div class="divider"></div>'+
    '<div class="checkbox-row"><input type="checkbox" id="f-highlight" '+(t.highlight?'checked':'')+'><label for="f-highlight">Выделить как рекомендуемый</label></div>';
  var feats = t.features.length ? t.features : [''];
  var fList = container.querySelector('#f-features-list');
  feats.forEach(function(f){ addFeatureRow(fList, f); });
  container.querySelector('#f-add-feature').onclick = function(){ addFeatureRow(fList, ''); };
}

function addFeatureRow(container, val){
  var row = document.createElement('div');
  row.className = 'feature-row';
  row.innerHTML = '<input type="text" value="'+ esc(val) +'" placeholder="Пункт возможностей"><button class="icon-btn danger" title="Удалить">✕</button>';
  row.querySelector('.icon-btn').onclick = function(){ container.removeChild(row); };
  container.appendChild(row);
}

function collectTierForm(container, id){
  var features = [];
  container.querySelectorAll('#f-features-list .feature-row input').forEach(function(inp){
    if(inp.value.trim()) features.push(inp.value.trim());
  });
  return {
    id: id || uid(),
    name:       container.querySelector('#f-name').value.trim(),
    flag:       container.querySelector('#f-flag').value.trim(),
    highlight:  container.querySelector('#f-highlight').checked,
    priceRub:   parseFloat(container.querySelector('#f-rub').value)||0,
    priceUsdt:  parseFloat(container.querySelector('#f-usdt').value)||0,
    priceUah:   parseFloat(container.querySelector('#f-uah').value)||0,
    priceStars: parseFloat(container.querySelector('#f-stars').value)||0,
    period:     container.querySelector('#f-period').value.trim() || '/ месяц',
    desc:       container.querySelector('#f-desc').value.trim(),
    features:   features.length ? features : [''],
    ctaText:    container.querySelector('#f-cta-text').value.trim() || 'Оформить',
    ctaLink:    container.querySelector('#f-cta-link').value.trim() || '#'
  };
}

function startEdit(id){
  editingId = id;
  var t = tiers.find(function(x){ return x.id===id; });
  if(!t) return;
  var wrap = document.getElementById('tier-editor-wrap');
  var form = document.getElementById('tier-editor-form');
  buildTierForm(form, t);
  wrap.style.display = '';
  renderAdminList();
  wrap.scrollIntoView({behavior:'smooth', block:'nearest'});
}

document.getElementById('editor-cancel').onclick = function(){
  editingId = null;
  document.getElementById('tier-editor-wrap').style.display = 'none';
  renderAdminList();
};

document.getElementById('editor-save').onclick = function(){
  if(!editingId) return;
  var form = document.getElementById('tier-editor-form');
  var updated = collectTierForm(form, editingId);
  var body = { name:updated.name, flag:updated.flag, highlight:updated.highlight, priceRub:updated.priceRub, priceUsdt:updated.priceUsdt, priceUah:updated.priceUah, priceStars:updated.priceStars, period:updated.period, description:updated.desc, features:updated.features, ctaText:updated.ctaText };
  apiFetch('/api/admin/tiers/' + editingId, { method:'PUT', body:JSON.stringify(body) })
    .then(function(){
      tiers = tiers.map(function(t){ return t.id===editingId ? updated : t; });
      editingId = null;
      document.getElementById('tier-editor-wrap').style.display = 'none';
      renderAdminList();
      showToast('Тариф сохранён ✓');
    }).catch(function(e){ showToast('Ошибка: ' + e.message); });
};

document.getElementById('new-tier-save').onclick = function(){
  var form = document.getElementById('new-tier-form');
  var t = collectTierForm(form, null);
  if(!t.name){ alert('Введите название'); return; }
  var body = { name:t.name, flag:t.flag, highlight:t.highlight, priceRub:t.priceRub, priceUsdt:t.priceUsdt, priceUah:t.priceUah, priceStars:t.priceStars, period:t.period, description:t.desc, features:t.features, ctaText:t.ctaText };
  apiFetch('/api/admin/tiers', { method:'POST', body:JSON.stringify(body) })
    .then(function(data){
      t.id = data.id;
      tiers.push(t);
      renderAdminList();
      switchTab('tiers');
      showToast('Тариф создан ✓');
    }).catch(function(e){ showToast('Ошибка: ' + e.message); });
};

document.getElementById('save-password').onclick = function(){
  var cur = document.getElementById('current-password').value;

      document.getElementById('current-password').value='';

      showToast('Пароль изменён ✓');
    }).catch(function(e){ err.textContent='Ошибка: '+e.message; err.style.display='block'; });

// ORDERS
// ============================================================
var ordersCache = [];

function refreshOrdersFromApi(){
  if(!adminToken) return Promise.resolve();
  return apiFetch('/api/admin/orders').then(function(data){
    ordersCache = (data.orders||[]).map(function(o){
      return { id:o.id, tierName:o.tier_name, methodId:o.method_id, methodName:o.method_name, amount:o.amount, contact:o.contact, fileName:o.file_name, fileType:o.file_type, status:o.status, createdAt:o.created_at, clientIp:o.client_ip||'', userAgent:o.user_agent||'' };
    });
    renderOrdersList();
    refreshOrdersBadge();
  }).catch(function(e){ console.warn('Не удалось загрузить заявки:', e); });
}

function refreshOrdersBadge(){
  var pendingCount = ordersCache.filter(function(o){ return o.status==='pending'; }).length;
  var badge = document.getElementById('orders-badge');
  if(!badge) return;
  if(pendingCount>0){ badge.textContent=pendingCount; badge.style.display='inline-flex'; }
  else { badge.style.display='none'; }
}

function renderOrdersList(){
  var wrap = document.getElementById('orders-list');
  if(!ordersCache.length){
    wrap.innerHTML = '<div class="order-empty">Заявок пока нет.</div>';
    return;
  }
  var statusLabel = { pending:'На проверке', approved:'Подтверждено', rejected:'Отклонено' };
  wrap.innerHTML = ordersCache.map(function(o){
    var dt = new Date(o.createdAt);
    var dateStr = dt.toLocaleDateString('ru-RU') + ' ' + dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    return ''+
    '<div class="order-item '+o.status+'">'+
      '<div class="order-top">'+
        '<div><div class="order-tier">'+ esc(o.tierName) +'</div><div class="order-date">'+ dateStr +'</div></div>'+
        '<div class="order-status '+o.status+'">'+ statusLabel[o.status] +'</div>'+
      '</div>'+
      '<div class="order-meta">'+
        '<div>Способ: <b>'+ esc(o.methodName) +'</b></div>'+
        '<div>Сумма: <b>'+ esc(o.amount) +'</b></div>'+
        '<div>Контакт: <b>'+ esc(o.contact) +'</b></div>'+
        (o.clientIp ? '<div style="font-size:11px;color:var(--text-dim)">IP: <b style="color:var(--red-bright)">'+ esc(o.clientIp) +'</b></div>' : '')+
        (o.userAgent ? '<div style="font-size:10px;color:var(--text-dim);word-break:break-all">'+ esc(o.userAgent.slice(0,120)) +'</div>' : '')+
      '</div>'+
      '<div class="order-receipt-link js-view-receipt" data-order-id="'+o.id+'">'+
        '<div class="file-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>'+
        '<span>'+ esc(o.fileName) +' (открыть)</span>'+
      '</div>'+
      (o.status==='pending' ?
        '<div class="order-actions">'+
          '<button class="approve-btn" data-order-id="'+o.id+'" data-action="approved">✓ Подтвердить</button>'+
          '<button class="reject-btn" data-order-id="'+o.id+'" data-action="rejected">✕ Отклонить</button>'+
        '</div>'
        : '<div class="order-actions"><button data-order-id="'+o.id+'" data-action="pending">↺ Вернуть на проверку</button></div>'
      )+
    '</div>';
  }).join('');
}

document.getElementById('orders-list').addEventListener('click', function(e){
  var viewLink = e.target.closest('.js-view-receipt');
  if(viewLink){
    var orderId = viewLink.getAttribute('data-order-id');
    var order = ordersCache.find(function(o){ return o.id===orderId; });
    var url = API_BASE + '/api/admin/orders/' + orderId + '/file';
    fetch(url, { headers:{'Authorization':'Bearer '+adminToken} })
      .then(function(res){ return res.blob(); })
      .then(function(blob){
        var objUrl = URL.createObjectURL(blob);
        if(order && (order.fileType||'').indexOf('image')===0){
          document.getElementById('lightbox-img').src = objUrl;
          document.getElementById('lightbox-overlay').classList.add('open');
        } else { window.open(objUrl,'_blank'); }
      }).catch(function(e){ showToast('Не удалось открыть файл: '+e.message); });
    return;
  }
  var actionBtn = e.target.closest('button[data-action]');
  if(actionBtn){
    var orderId2 = actionBtn.getAttribute('data-order-id');
    var newStatus = actionBtn.getAttribute('data-action');
    actionBtn.disabled = true;
    apiFetch('/api/admin/orders/'+orderId2, { method:'PUT', body:JSON.stringify({status:newStatus}) })
      .then(function(){ return refreshOrdersFromApi(); })
      .catch(function(e){ showToast('Ошибка: '+e.message); })
      .finally(function(){ actionBtn.disabled=false; });
  }
});

document.getElementById('lightbox-close').onclick = function(){ document.getElementById('lightbox-overlay').classList.remove('open'); };
document.getElementById('lightbox-overlay').onclick = function(e){ if(e.target===this) this.classList.remove('open'); };

// ============================================================
// LOGS
// ============================================================
var logsCache = [], logsTotal = 0, logsOffset = 0, logsLimit = 50, logsType = 'all';

function refreshLogsFromApi(){
  if(!adminToken) return;
  var list = document.getElementById('logs-list');
  list.innerHTML = '<div class="order-empty">Загрузка…</div>';
  Promise.all([
    apiFetch('/api/admin/logs/stats'),
    apiFetch('/api/admin/logs?type='+logsType+'&limit='+logsLimit+'&offset='+logsOffset)
  ]).then(function(results){
    logsCache = results[1].logs || [];
    logsTotal = results[1].total || 0;
    renderLogsStats(results[0]);
    renderLogsList();
    renderLogsPagination();
  }).catch(function(e){ list.innerHTML = '<div class="order-empty">Ошибка: '+esc(e.message)+'</div>'; });
}

function renderLogsStats(data){
  var bar = document.getElementById('logs-stats-bar');
  var byType = data.byType || [];
  var total = byType.reduce(function(s,r){ return s+Number(r.c); }, 0);
  var typeLabels = { 'request':'Посещения','order_submit':'Заявки','admin_login_ok':'Входы','admin_login_fail':'Неверный пароль','visit':'Визиты' };
  var boxes = '<div class="logs-stats"><div class="log-stat-box"><span class="log-stat-num">'+total+'</span><span class="log-stat-lbl">Всего событий</span></div>';
  byType.forEach(function(row){
    boxes += '<div class="log-stat-box"><span class="log-stat-num">'+row.c+'</span><span class="log-stat-lbl">'+esc(typeLabels[row.event_type]||row.event_type)+'</span></div>';
  });
  boxes += '</div>';
  if(data.topIps && data.topIps.length){
    boxes += '<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;font-weight:600;">ТОП IP-адресов:</div>';
    boxes += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">';
    data.topIps.slice(0,10).forEach(function(row){
      boxes += '<div style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;"><b style="color:var(--red-bright)">'+esc(row.ip)+'</b> <span style="color:var(--text-dim)">× '+row.c+'</span></div>';
    });
    boxes += '</div>';
  }
  bar.innerHTML = boxes;
}

function renderLogsList(){
  var list = document.getElementById('logs-list');
  if(!logsCache.length){ list.innerHTML='<div class="order-empty">Логов пока нет.</div>'; return; }
  var eventLabels = { 'request':'Запрос','visit':'Визит','order_submit':'📋 Заявка','admin_login_ok':'🔑 Вход','admin_login_fail':'🚫 Неверный пароль' };
  list.innerHTML = logsCache.map(function(log){
    var dt = new Date(log.created_at);
    var dateStr = dt.toLocaleDateString('ru-RU')+' '+dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    var label = eventLabels[log.event_type] || log.event_type;
    var extra = '';
    if(log.extra){ try{ var ex=JSON.parse(log.extra); var parts=[]; if(ex.tierName) parts.push('Тариф: <b>'+esc(ex.tierName)+'</b>'); if(ex.contact) parts.push('Контакт: <b>'+esc(ex.contact)+'</b>'); if(ex.methodId) parts.push('Способ: '+esc(ex.methodId)); if(parts.length) extra='<div class="log-extra">'+parts.join(' · ')+'</div>'; }catch(e){} }
    return '<div class="log-item event-'+log.event_type+'"><div class="log-top"><span class="log-event ev-'+log.event_type+'">'+label+'</span><span class="log-date">'+dateStr+'</span></div><div class="log-ip">'+esc(log.ip||'—')+(log.country?' <span style="color:var(--text-dim)">['+esc(log.country)+']</span>':'')+'</div>'+(log.path?'<div class="log-path">'+esc(log.method||'GET')+' '+esc(log.path)+'</div>':'')+(log.user_agent?'<div class="log-ua">'+esc(log.user_agent.slice(0,150))+'</div>':'')+extra+'</div>';
  }).join('');
}

function renderLogsPagination(){
  var pg = document.getElementById('logs-pagination');
  var totalPages = Math.ceil(logsTotal/logsLimit);
  var curPage = Math.floor(logsOffset/logsLimit)+1;
  if(totalPages<=1){ pg.style.display='none'; return; }
  pg.style.display='flex';
  pg.innerHTML = '<button class="logs-page-btn" id="logs-prev" '+(curPage<=1?'disabled':'')+'>← Пред</button><span class="logs-page-info">Стр. '+curPage+' / '+totalPages+' (всего '+logsTotal+')</span><button class="logs-page-btn" id="logs-next" '+(curPage>=totalPages?'disabled':'')+'>След →</button>';
  document.getElementById('logs-prev').onclick = function(){ if(logsOffset>0){ logsOffset=Math.max(0,logsOffset-logsLimit); refreshLogsFromApi(); } };
  document.getElementById('logs-next').onclick = function(){ if(logsOffset+logsLimit<logsTotal){ logsOffset+=logsLimit; refreshLogsFromApi(); } };
}

document.getElementById('logs-filter-type').onchange = function(){ logsType=this.value; logsOffset=0; refreshLogsFromApi(); };
document.getElementById('logs-refresh-btn').onclick = function(){ logsOffset=0; refreshLogsFromApi(); };
document.getElementById('logs-clear-btn').onclick = function(){
  if(!confirm('Очистить все логи? Это действие необратимо.')) return;
  apiFetch('/api/admin/logs', { method:'DELETE' }).then(function(){
    logsCache=[]; logsTotal=0; logsOffset=0;
    document.getElementById('logs-list').innerHTML='<div class="order-empty">Логи очищены.</div>';
    document.getElementById('logs-stats-bar').innerHTML='';
    document.getElementById('logs-pagination').style.display='none';
    showToast('Логи очищены ✓');
  }).catch(function(e){ showToast('Ошибка: '+e.message); });
};
</script>
